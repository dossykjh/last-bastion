  display:grid;grid-template-columns:1fr auto;gap:5px 10px;font:400 14px/1.2 var(--fd);color:#d7ecff}
.lb-tp-stats b{font:400 17px/1.1 var(--fd);color:#fff;text-align:right;text-shadow:${et(1.5,1)}}
.lb-tp-btns{display:flex;gap:8px}
.lb-act{flex:1;height:58px;--rr:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lb-act b{display:flex;align-items:center;gap:3px;font:400 16px/1 var(--fd);white-space:nowrap;text-shadow:${et(2,2)}}
.lb-act b .lb-ic{width:20px;height:20px}
.lb-act .lb-cost{background:rgba(26,18,56,.4);border-radius:8px;padding:2px 7px}
.lb-up{--face:var(--f-grn);--sd:var(--s-grn)}
.lb-sell{--face:var(--f-red);--sd:var(--s-red)}
.lb-sell .lb-cost{color:var(--ye)}
.lb-act.lb-dis{--face:var(--f-grey);--sd:var(--s-grey);cursor:default}
.lb-act.lb-dis b .lb-ic{filter:grayscale(1)}
.lb-act.lb-no:not(.lb-dis){--face:linear-gradient(180deg,#c9dcb6,#93ad84 50%,#73906a);--sd:var(--s-grey)}

/* \u2500\u2500 banner / pause / hurt \u2500\u2500 */
.lb-hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(255,40,60,.6) 100%)}
.lb-banner{position:absolute;left:0;right:0;top:36%;height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden}
.lb-banner.show{visibility:visible}
.lb-ban-band{position:absolute;left:0;right:0;top:-66px;height:132px;opacity:0}
.lb-ban-band::before{content:'';position:absolute;inset:0 -4%;rotate:-3deg;background:var(--f-pur);border-block:5px solid var(--ink);
  box-shadow:inset 0 -9px 0 var(--s-pur),inset 0 6px 0 rgba(255,255,255,.35);
  -webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.lb-ban-band::after{content:'';position:absolute;left:-4%;right:-4%;top:-14px;height:8px;rotate:-3deg;background:repeating-linear-gradient(-60deg,var(--ye) 0 14px,transparent 14px 28px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.lb-ban-flash{position:absolute;left:0;right:0;top:-70px;height:140px;background:radial-gradient(ellipse 40% 50% at 50% 50%,rgba(255,255,255,.85),transparent 70%);opacity:0}
.lb-ban-t{position:relative;font:400 84px/1 var(--fd);letter-spacing:.04em;color:#fff;white-space:nowrap;opacity:0;rotate:-3deg;text-shadow:${et(5,6)}}
.lb-ban-s{position:relative;display:flex;align-items:center;gap:8px;margin-top:10px;padding:6px 18px 8px 10px;border-radius:999px;opacity:0;
  background:var(--f-red);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 var(--s-red),inset 0 2px 0 rgba(255,255,255,.4);
  font:400 21px/1 var(--fd);text-shadow:${et(2,2)}}
.lb-ban-s .lb-ic{width:26px;height:26px;color:var(--ye)}
.lb-banner.show .lb-ban-band{animation:lb-band 1.6s cubic-bezier(.2,.8,.2,1) both}
.lb-banner.show .lb-ban-flash{animation:lb-flash 1.6s ease-out both}
.lb-banner.show .lb-ban-t{animation:lb-ban-t 1.6s cubic-bezier(.2,.9,.25,1) both}
.lb-banner.show .lb-ban-s{animation:lb-ban-s 1.6s ease-out both}
.lb-pausebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .2s;
  background:rgba(20,12,60,.45);visibility:hidden}
.lb-root.lb-paused .lb-pausebox{opacity:1;visibility:visible}
.lb-pausebox::before{content:'';position:absolute;left:-4%;right:-4%;top:50%;height:112px;margin-top:-56px;rotate:-2deg;background:var(--f-blue);border-block:5px solid var(--ink);
  box-shadow:inset 0 -8px 0 var(--s-blue),inset 0 5px 0 rgba(255,255,255,.35)}
.lb-pausebox>*{position:relative;rotate:-2deg}
.lb-pausebox b{font:400 46px/1 var(--fd);letter-spacing:.1em;padding-left:.1em;text-shadow:${et(3,4)}}
.lb-pausebox small{font:400 17px/1 var(--fd);letter-spacing:.4em;padding-left:.4em;color:var(--ye);text-shadow:${et(2,2)}}

/* \u2500\u2500 result \u2500\u2500 */
.lb-result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:0;transition:opacity .35s;overflow:hidden;
  padding:calc(var(--st) + 12px) calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px);
  background:radial-gradient(ellipse at 50% 38%,rgba(80,170,255,.9),rgba(52,40,160,.94) 55%,rgba(24,14,70,.98))}
.lb-result::before{content:'';position:absolute;left:50%;top:34%;width:calc(var(--vw,1vw)*180);aspect-ratio:1;margin:calc(var(--vw,1vw)*-90) 0 0 calc(var(--vw,1vw)*-90);
  background:repeating-conic-gradient(rgba(255,255,255,.11) 0 9deg,transparent 9deg 22.5deg);pointer-events:none;
  -webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%);mask:radial-gradient(closest-side,#000 20%,transparent 75%);animation:lb-spin 40s linear infinite}
.lb-result.lose{background:radial-gradient(ellipse at 50% 38%,rgba(150,80,140,.88),rgba(70,26,70,.95) 55%,rgba(26,8,24,.98))}
.lb-result.lose::before{opacity:.35;animation-duration:90s}
.lb-result.show{opacity:1}
.lb-rp{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;isolation:isolate}
.lb-rp::before{content:'';position:absolute;z-index:-1;left:50%;top:-30px;width:560px;height:280px;margin-left:-280px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,236,140,.55),transparent);animation:lb-fade .8s ease-out both}
.lose .lb-rp::before{background:radial-gradient(closest-side,rgba(255,90,90,.35),transparent)}
.lb-r-en{font:400 22px/1 var(--fd);letter-spacing:.32em;padding:6px 14px 8px 20px;border-radius:999px;background:var(--f-blue);border:3px solid var(--ink);
  box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 var(--s-blue),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:${et(2,2)}}
.lose .lb-r-en{background:var(--f-grey);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 var(--s-grey),inset 0 2px 0 rgba(255,255,255,.45)}
.lb-r-ko{font:400 124px/1.05 var(--fd);letter-spacing:.04em;padding:0 .12em;rotate:-4deg;margin:-6px 0 -4px;
  background:linear-gradient(180deg,#fffbd0 0%,#ffe94a 38%,#ffb514 62%,#ff7a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px var(--ink);filter:${pa(4,9)}}
.win .lb-r-ko::after{content:'!'}
.lose .lb-r-ko{background-image:linear-gradient(180deg,#f2eefc 0%,#c8c2e6 40%,#8e86b8 62%,#5e5888 100%)}
.lb-stars{display:flex;align-items:flex-end;gap:12px;margin-top:-6px}
.lb-star{position:relative;width:76px;height:76px}
.lb-star.mid{width:98px;height:98px;margin-bottom:16px}
.lb-star .lb-ic{position:absolute;inset:0;width:100%;height:100%}
.lb-star.on .gold{animation:lb-star-in .55s cubic-bezier(.3,1.8,.45,1) var(--d) both;filter:drop-shadow(0 4px 0 rgba(26,18,56,.6))}
.lb-star.on::before{content:'';position:absolute;inset:-48%;background:repeating-conic-gradient(rgba(255,240,140,.7) 0 8deg,transparent 8deg 24deg);
  -webkit-mask:radial-gradient(closest-side,#000 35%,transparent);mask:radial-gradient(closest-side,#000 35%,transparent);
  animation:lb-rays .9s ease-out var(--d) both}
.lb-r-stats{display:flex;gap:10px}
.lb-r-stat{--rr:16px;min-width:120px;padding:6px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lb-r-stat span{font:400 14px/1 var(--fd);color:var(--lav);letter-spacing:.04em;text-shadow:${et(1.5,1)}}
.lb-r-stat b{font:400 32px/1 var(--fd);color:#fff;text-shadow:${et(2,3)}}
.lb-r-stat b small{font-size:.62em;color:var(--lav)}
.lb-r-btns{display:flex;gap:12px;margin-top:4px}
.lb-big{--face:var(--f-blue);--sd:var(--s-blue);--rr:18px;--lip:5px;height:62px;min-width:154px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1}
.lb-big b{font:400 23px/1 var(--fd);text-shadow:${et(2,3)}}
.lb-big small{font:400 12px/1 var(--fd);letter-spacing:.24em;padding-left:.24em;color:rgba(26,18,56,.72)}
.lb-big.pri{--face:var(--f-yel);--sd:var(--s-yel)}
.lb-big.pri small{color:#8a3c00}
.lb-rp>*{animation:lb-rise .5s cubic-bezier(.3,1.5,.5,1) both}
.lb-rp>.lb-r-ko{animation:lb-slam .6s cubic-bezier(.3,1.5,.4,1) .1s both}
.lb-rp>.lb-r-stats{animation-delay:.9s}.lb-rp>.lb-r-btns{animation-delay:1.05s}.lb-rp>.lb-stars{animation-delay:.25s}

/* \u2500\u2500 title \u2500\u2500 */
.lb-title{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);opacity:0;transition:opacity .4s;
  background:linear-gradient(180deg,rgba(52,30,150,.86) 0%,rgba(36,84,210,.72) 52%,rgba(28,22,100,.92) 100%)}
.lb-title.show{opacity:1}
.lb-title::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(16,8,50,.65))}
.lb-t-grid{position:absolute;left:50%;top:32%;width:calc(var(--vw,1vw)*190);aspect-ratio:1;margin:calc(var(--vw,1vw)*-95) 0 0 calc(var(--vw,1vw)*-95);pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.1) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(closest-side,#000 12%,transparent 72%);mask:radial-gradient(closest-side,#000 12%,transparent 72%);animation:lb-spin 60s linear infinite}
.lb-t-embers{position:absolute;inset:0;pointer-events:none}
.lb-t-embers i{position:absolute;bottom:-14px;width:12px;height:12px;background:#fff6b0;opacity:0;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:lb-ember var(--s) linear var(--d) infinite}
.lb-t-embers i:nth-child(3n){background:#9fe8ff;width:9px;height:9px}
.lb-t-embers i:nth-child(4n){width:16px;height:16px}
.lb-t-logo{position:relative;z-index:1;display:flex;align-items:center;gap:10px;animation:lb-rise .7s cubic-bezier(.3,1.5,.5,1) both}
.lb-t-logo::before{content:'';position:absolute;z-index:-1;left:-25%;right:-25%;top:50%;height:260px;margin-top:-130px;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,236,140,.4),transparent 72%);animation:lb-flare 3s ease-in-out infinite}
.lb-emblem{width:168px;height:auto;rotate:-6deg;filter:drop-shadow(0 6px 0 rgba(26,18,56,.85))}
.lb-t-words{display:flex;flex-direction:column;align-items:center;rotate:-4deg;animation:lb-bob 1.6s ease-in-out infinite alternate}
.lb-t-last{font:400 36px/1 var(--fd);letter-spacing:.42em;padding-left:.42em;color:#fff;margin-bottom:-6px;text-shadow:${et(3,4)}}
.lb-t-bast{font:400 116px/1 var(--fd);letter-spacing:.02em;padding:0 .06em;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(180deg,#fffcd8 0%,#ffef5a 34%,#ffc21a 58%,#ff8812 100%);-webkit-text-stroke:3px var(--ink);filter:${pa(5,11)}}
.lb-t-bar{margin-top:6px;padding:6px 22px 9px;border-radius:14px;font:400 25px/1 var(--fd);letter-spacing:.3em;padding-left:calc(22px + .3em);
  background:var(--f-red);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 var(--s-red),inset 0 3px 0 rgba(255,255,255,.4);text-shadow:${et(2,2)}}
.lb-t-stages{position:relative;z-index:1;display:flex;gap:14px;max-width:100%;overflow-x:auto;padding:8px 6px 14px;scroll-snap-type:x mandatory;
  scrollbar-width:none;animation:lb-rise .7s cubic-bezier(.3,1.5,.5,1) .15s both}
.lb-t-stages::-webkit-scrollbar{display:none}
.lb-card{--face:var(--f-blue);--sd:var(--s-blue);--rr:20px;--lip:5px;flex:none;width:158px;height:154px;padding:9px 12px 12px;display:flex;flex-direction:column;align-items:flex-start;
  scroll-snap-align:center;overflow:hidden;transition:translate .14s cubic-bezier(.3,1.6,.5,1),scale .12s cubic-bezier(.3,1.6,.5,1),filter .15s}
@media (hover:hover){.lb-card:not(.lb-lock):hover{translate:0 -4px}}
.lb-card>*{position:relative}
.lb-card>.lb-card-pl{position:absolute;right:-22px;top:-22px;width:88px;height:88px;border-radius:50%;border:3px solid var(--ink);
  background:radial-gradient(circle at 36% 32%,#fff 0 6%,var(--a) 22%,var(--b) 92%);box-shadow:inset -8px -9px 0 rgba(26,18,56,.28)}
.lb-card>.lb-card-pl::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:4px solid rgba(255,255,255,.75);transform:scaleY(.3) rotate(-14deg)}
.lb-card-no{display:flex;align-items:baseline;gap:5px;font:400 44px/1 var(--fd);color:#fff;text-shadow:${et(2.5,3)}}
.lb-card-no small{font-size:12px;letter-spacing:.16em;color:var(--ye);text-shadow:${et(1.5,1)}}
.lb-card-name{margin-top:5px;font:400 19px/1.15 var(--fd);text-shadow:${et(2,2)}}
.lb-card-sub{margin-top:3px;font:400 13px/1.3 var(--fd);color:#123a8a;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb-card.lb-lock .lb-card-sub{-webkit-line-clamp:1;padding-right:34px}
.lb-card-stars{margin-top:auto;display:flex;gap:3px}
.lb-card-stars .lb-ic{width:25px;height:25px;filter:drop-shadow(0 2px 0 rgba(26,18,56,.5))}
.lb-card.lb-lock{--face:var(--f-grey);--sd:var(--s-grey);cursor:default}
.lb-card.lb-lock>*:not(.lb-card-lock){opacity:.5}
.lb-card.lb-lock>.lb-card-pl{filter:grayscale(1)}
.lb-card.lb-lock .lb-card-sub{color:#3a3660}
.lb-card>.lb-card-lock{position:absolute;right:8px;bottom:9px}
.lb-card-lock .lb-ic{width:40px;height:40px;filter:drop-shadow(0 3px 0 rgba(26,18,56,.6))}
.lb-t-start{position:relative;z-index:1;height:70px;min-width:280px;--rr:22px;--lip:6px;overflow:hidden;
  animation:lb-rise .7s cubic-bezier(.3,1.5,.5,1) .3s both,lb-pulse 1.4s ease-in-out 1.2s infinite}
.lb-t-start b{font-size:32px;letter-spacing:.24em;padding-left:.24em;text-shadow:${et(2.5,3)}}
.lb-t-start small{font-size:13px}
.lb-t-start::after{content:'';position:absolute;z-index:-1;top:-10%;bottom:-10%;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8) 45%,rgba(255,255,255,.8) 55%,transparent);animation:lb-sheen 2.6s ease-in-out infinite}

/* \u2500\u2500 keyframes \u2500\u2500 */
@keyframes lb-spin{to{transform:rotate(360deg)}}
@keyframes lb-ret-in{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes lb-fade{from{opacity:0}to{opacity:1}}
@keyframes lb-glow{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes lb-bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes lb-pulse{0%,100%{transform:none}50%{transform:scale(1.05)}}
@keyframes lb-sheen{0%,55%{transform:translateX(-130%) skewX(-18deg)}100%{transform:translateX(380%) skewX(-18deg)}}
@keyframes lb-blink{0%{opacity:1}100%{opacity:.45}}
@keyframes lb-toast-in{0%{transform:translateY(-14px) scale(.5);opacity:0}65%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes lb-toast-out{to{transform:translateY(-8px) scale(.9);opacity:0}}
@keyframes lb-band{0%{transform:scaleX(0);opacity:0}12%{transform:scaleX(1);opacity:1}84%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.1);opacity:0}}
@keyframes lb-flash{0%{opacity:0}12%{opacity:1}30%{opacity:0}100%{opacity:0}}
@keyframes lb-ban-t{0%,8%{opacity:0;transform:scale(2.2)}20%{opacity:1;transform:scale(.92)}28%{transform:scale(1.04)}34%{transform:none}84%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes lb-ban-s{0%,20%{opacity:0;transform:translateY(14px) scale(.6)}32%{opacity:1;transform:scale(1.06)}38%{transform:none}84%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes lb-slam{0%{transform:scale(2.6);opacity:0}55%{transform:scale(.9);opacity:1}78%{transform:scale(1.05)}100%{transform:none;opacity:1}}
@keyframes lb-star-in{0%{transform:scale(2.8) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes lb-rays{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1) rotate(50deg);opacity:.5}}
@keyframes lb-rise{from{transform:translateY(22px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-ember{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,calc(var(--vh,1vh)*-15)) rotate(60deg) scale(1)}
  50%{opacity:.35}65%{opacity:1}100%{transform:translate(var(--dx),calc(var(--vh,1vh)*-105)) rotate(300deg) scale(.6);opacity:0}}
@keyframes lb-flare{0%,100%{opacity:.6}50%{opacity:1}}

/* \u2500\u2500 short screens (Fold cover ~900\xD7400): tighter paddings/fonts, 44 px touch targets kept \u2500\u2500 */
/* size rules ask the HUD root (container queries), not the window: on a phone held upright the stage is turned 90\xB0 */
@container lb (max-height:560px){
  .lb-tl,.lb-tr{top:calc(var(--st) + 6px)}
  .lb-tl{gap:7px}
  .lb-res{gap:18px;padding-left:16px}
  .lb-chip{height:36px;padding:0 10px 0 26px}
  .lb-chip .lb-ic{width:38px;height:38px;margin-top:-20px;left:-17px}
  .lb-num{font-size:22px}.lb-max{font-size:15px;margin-top:3px}
  .lb-buy{height:44px}.lb-buy b{font-size:17px}
  .lb-wave{padding:2px 24px 9px;min-width:220px;gap:3px;--rr:18px}
  .lb-wave-cur{font-size:28px}.lb-wave-tot{font-size:17px;padding-bottom:3px}.lb-wave-lbl{font-size:15px}
  .lb-wave-top .lb-ic{width:24px;height:24px}
  .lb-life .lb-ic{width:22px;height:22px}.lb-bar{height:15px;min-width:100px}.lb-life-num{font-size:17px}
  .lb-boss .lb-bar{height:15px}.lb-boss-top{font-size:15px}.lb-boss-top b{font-size:16px}
  .lb-tc{gap:6px}
  .lb-toast{font-size:14px;padding:5px 15px 7px 7px}.lb-toast .lb-ic{width:21px;height:21px}
  .lb-seg button{width:48px}
  .lb-pause,.lb-fs{width:48px;height:52px}
  .lb-br{right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 10px)}
  .lb-next-body{height:58px;gap:8px;padding:0 8px 0 10px;--rr:16px;--lip:4px}
  .lb-next-body>.lb-ic{width:34px;height:34px}
  .lb-next-txt b{font-size:19px}.lb-next-txt small{font-size:10.5px;margin-top:4px}
  .lb-next-bonus{font-size:19px;padding:5px 7px 5px 8px}.lb-next-bonus .lb-ic{width:19px;height:19px}
  .lb-tp{width:300px;padding:7px 10px 10px}
  .lb-tp-ic{width:44px;height:44px}.lb-tp-ic .lb-ic{width:33px;height:33px}
  .lb-tp-name{font-size:17px}
  .lb-tp-stats{grid-template-columns:1fr auto 1fr auto;margin:6px 0 8px;padding:5px 9px;gap:3px 8px;font-size:12.5px}
  .lb-tp-stats b{font-size:15px}
  .lb-act{height:48px;gap:3px}.lb-act b{font-size:14.5px}
  .lb-ban-band{top:-50px;height:100px}
  .lb-ban-t{font-size:58px;text-shadow:${et(4,5)}}.lb-ban-s{font-size:16px;margin-top:6px}
  .lb-pausebox::before{height:90px;margin-top:-45px}
  .lb-pausebox b{font-size:36px}
  .lb-rp{gap:8px}
  .lb-r-en{font-size:15px;padding:4px 10px 6px 15px}
  .lb-r-ko{font-size:68px;-webkit-text-stroke:2px var(--ink);filter:${pa(3,6)};margin:-4px 0 -2px}
  .lb-star{width:50px;height:50px}.lb-star.mid{width:66px;height:66px;margin-bottom:9px}
  .lb-r-stat{min-width:98px;padding:3px 12px 7px}.lb-r-stat b{font-size:23px}.lb-r-stat span{font-size:12px}
  .lb-big{height:50px;min-width:128px;--lip:4px}
  .lb-big b{font-size:18px}
