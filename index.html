.lb-root{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;color:#e4f6ff;container:lb/size;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  --cy:#3fd0ff;--ye:#f2c12e;--rd:#ff5a4a;--gn:#5ff0a0;--dim:#8ba5b9;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --fn:'Rajdhani','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',Roboto,system-ui,sans-serif;

  --edge:linear-gradient(180deg,#b4f0ff 0%,#3fd0ff 26%,rgba(32,104,140,.85) 62%,rgba(63,208,255,.6) 100%);

    repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#2a3441 0%,#171e28 52%,#0b1017 100%);
  font-family:var(--fn)}
.lb-root *{box-sizing:border-box}
:where(.lb-root) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;pointer-events:auto;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none;text-align:inherit}
:where(.lb-root) button:focus-visible{outline:2px solid var(--ye);outline-offset:3px}
.lb-ic{display:block;flex:none;width:24px;height:24px;overflow:visible}

/* \u2500\u2500 chamfered metal frame \u2500\u2500 */
.lb-f{position:relative;--c:10px;--glint:linear-gradient(transparent,transparent);background:var(--glint),var(--edge);isolation:isolate}
.lb-f::before{content:'';position:absolute;inset:1.5px;z-index:-1;background:var(--fill);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.11),inset 0 -3px 8px rgba(0,0,0,.55),inset 0 0 18px rgba(63,208,255,.08)}
/* hardware details: tick LEDs on plates, a hazard pip under the wave tab */
.lb-res::after,.lb-tp::after{content:'';position:absolute;right:11px;top:4px;width:17px;height:3px;opacity:.75;background:repeating-linear-gradient(90deg,var(--cy) 0 3px,transparent 3px 5px)}
.lb-wave::after{content:'';position:absolute;left:50%;bottom:3px;width:44px;height:3px;margin-left:-22px;background:var(--ye);box-shadow:0 0 6px var(--ye)}
${d_}
.lb-sh{filter:drop-shadow(0 3px 3px rgba(0,0,0,.75)) drop-shadow(0 0 5px rgba(63,208,255,.3))}
.lb-btn{transition:transform .09s ease-out,filter .15s}
.lb-btn:active{transform:scale(.94)}
@media (hover:hover){.lb-btn:hover{filter:brightness(1.22) drop-shadow(0 0 6px rgba(63,208,255,.55))}}
.lb-cost{display:inline-flex;align-items:center;gap:2px;font:700 15px/1 var(--fn);color:#eaf8ff;white-space:nowrap}
.lb-cost .lb-ic{width:15px;height:15px;margin-left:3px}
.lb-cost .lb-ic:first-child{margin-left:0}
.lb-no .lb-cost,.lb-cost.lb-no{color:var(--rd)}

/* \u2500\u2500 HUD clusters \u2500\u2500 */
.lb-hud{position:absolute;inset:0;transition:opacity .3s}
.lb-root.lb-cover .lb-hud{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.lb-tl{position:absolute;left:calc(var(--sl) + 10px);top:calc(var(--st) + 8px);display:flex;flex-direction:column;align-items:flex-start;gap:6px}

.lb-tr{position:absolute;right:calc(var(--sr) + 10px);top:calc(var(--st) + 8px);display:flex;gap:8px;align-items:flex-start}
.lb-br{position:absolute;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 12px)}
.lb-row{display:flex;gap:6px;align-items:center}

/* resources */
.lb-res{display:flex;align-items:center;height:44px;padding:0 14px 0 10px;gap:4px;--c:10px}

  text-shadow:0 0 8px var(--g,rgba(63,208,255,.45)),0 1px 0 #000;font-variant-numeric:tabular-nums}

.lb-chip.scv{--g:rgba(242,170,60,.5);--nc:#ffe6b8}
.lb-chip.scv .lb-num{min-width:0}
.lb-max{font:700 18px/1 var(--fn);color:var(--dim);margin-left:1px}
.lb-sep{width:1px;align-self:stretch;margin:9px 8px;background:linear-gradient(transparent,rgba(63,208,255,.7),transparent)}
.lb-buy{height:44px;padding:0 12px 0 10px;--c:8px;display:flex;align-items:center;gap:7px;
  --edge:linear-gradient(180deg,#ffe58a,#f2c12e 40%,#8a6a10)}
.lb-buy b{font:700 17px/1 var(--fn);letter-spacing:.04em;color:#ffe9a8}

/* wave + command center */
.lb-wave{--c:22px;padding:5px 34px 11px;min-width:256px;display:flex;flex-direction:column;gap:5px;
  --fill:linear-gradient(180deg,rgba(63,208,255,.12),rgba(63,208,255,0) 45%),var(--noise) 0 0/440px 30px,
    repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),linear-gradient(180deg,#1b2430,#0a0f15)}

.lb-wave-lbl{font:700 15px/1 var(--fn);letter-spacing:.28em;color:var(--dim);margin-right:2px}

.lb-life .lb-ic{width:22px;height:22px}
.lb-bar{position:relative;flex:1;height:12px;min-width:120px;background:#03070b;overflow:hidden;
  border:1px solid rgba(63,208,255,.4);box-shadow:inset 0 1px 3px #000;transform:skewX(-14deg)}

.lb-boss{--c:10px;width:min(440px,calc(var(--vw,1vw)*48));padding:5px 14px 8px;display:flex;flex-direction:column;gap:4px;

.lb-boss-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:900 14px/1.1 var(--fk);color:#ffd8cf;letter-spacing:.05em}
.lb-boss-top b{font:700 15px/1 var(--fn);color:#ff9a8a}

/* toasts */
.lb-toasts{display:flex;flex-direction:column;align-items:center;gap:6px}

.lb-toast.good{--k:var(--gn);--edge:linear-gradient(180deg,#c8ffe0,#3fe28a 40%,#145a36)}
.lb-toast.out{animation:lb-toast-out .3s ease-in both}

  font:700 17px/1 var(--fn);transition:color .15s,background .15s}

.lb-t-fs{position:absolute;z-index:2;right:calc(var(--sr) + 14px);top:calc(var(--st) + 12px);width:50px;height:50px;--c:9px;display:grid;place-items:center;color:#cfefff}

/* \u2500\u2500 build menu / tower panel \u2500\u2500 */

  transform:translate(-50%,calc(var(--hh,32px) * -1)) scale(.2);transform-origin:50% var(--hh,32px);opacity:0;

.lb-bm-btn.up .lb-bm-cap{clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% 100%,0 100%,0 5px);border-top:0;border-bottom:1px solid rgba(63,208,255,.55)}

.lb-lead{position:absolute;height:1.5px;transform-origin:0 50%;background:linear-gradient(90deg,var(--ye),rgba(63,208,255,.8));box-shadow:0 0 6px var(--cy)}

.lb-tp-lv{display:flex;gap:4px;align-items:center;margin-top:4px;font:700 13px/1 var(--fn);color:var(--dim);letter-spacing:.14em}
.lb-pip{width:15px;height:7px;background:#16202a;border:1px solid rgba(63,208,255,.45);transform:skewX(-22deg)}
.lb-pip.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.lb-tp-stats{margin:9px 0 10px;padding:7px 0 0;border-top:1px solid rgba(63,208,255,.25);display:grid;grid-template-columns:1fr auto;gap:4px 10px;
  font:700 13.5px/1.2 var(--fk);color:var(--dim)}
.lb-tp-stats b{font:700 16px/1.1 var(--fn);color:#fff;text-align:right}
.lb-tp-btns{display:flex;gap:7px}
.lb-act{flex:1;height:54px;--c:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lb-act b{display:flex;align-items:center;gap:4px;font:900 14px/1 var(--fk);white-space:nowrap}
.lb-act b .lb-ic{width:18px;height:18px}
.lb-up{--edge:linear-gradient(180deg,#c8ffe8,#3fe2a0 35%,#1a6a5a 75%,#3fd0ff)}
.lb-sell{--edge:linear-gradient(180deg,#ffe58a,#f2c12e 40%,#6a5210)}
.lb-sell .lb-cost{color:var(--ye)}
.lb-act.lb-dis{filter:grayscale(1) brightness(.55);cursor:default}
.lb-act.lb-no:not(.lb-dis){--edge:linear-gradient(180deg,#ff9a8a,#a03030)}

/* \u2500\u2500 banner / pause / hurt \u2500\u2500 */
.lb-hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(255,40,30,.55) 100%)}
.lb-banner{position:absolute;left:0;right:0;top:36%;height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden}
.lb-banner.show{visibility:visible}
.lb-ban-band{position:absolute;left:0;right:0;top:-62px;height:124px;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(4,9,15,.86) 22%,rgba(4,9,15,.86) 78%,transparent)}
.lb-ban-band::before,.lb-ban-band::after{content:'';position:absolute;left:8%;right:8%;height:1.5px;background:linear-gradient(90deg,transparent,var(--cy) 30%,#fff 50%,var(--cy) 70%,transparent);box-shadow:0 0 10px var(--cy)}
.lb-ban-band::before{top:0}.lb-ban-band::after{bottom:0}
.lb-ban-flash{position:absolute;left:0;right:0;top:-1px;height:3px;background:#fff;box-shadow:0 0 18px 4px var(--cy);opacity:0}
.lb-ban-t{position:relative;font:700 74px/1 var(--fn);letter-spacing:.14em;padding-left:.14em;color:#fff;white-space:nowrap;opacity:0;
  text-shadow:0 0 22px rgba(63,208,255,.95),0 0 3px #fff,0 4px 0 #082a40}
.lb-ban-s{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;font:900 21px/1 var(--fk);color:var(--ye);letter-spacing:.08em;opacity:0;
  text-shadow:0 0 10px rgba(242,193,46,.55),0 2px 0 #000}
.lb-ban-s .lb-ic{width:20px;height:20px;color:var(--ye)}
.lb-banner.show .lb-ban-band{animation:lb-band 1.6s cubic-bezier(.2,.8,.2,1) both}
.lb-banner.show .lb-ban-flash{animation:lb-flash 1.6s ease-out both}
.lb-banner.show .lb-ban-t{animation:lb-ban-t 1.6s cubic-bezier(.2,.9,.25,1) both}
.lb-banner.show .lb-ban-s{animation:lb-ban-s 1.6s ease-out both}
.lb-pausebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transition:opacity .2s;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(2,6,10,.55));visibility:hidden}
.lb-root.lb-paused .lb-pausebox{opacity:1;visibility:visible}
.lb-pausebox::before{content:'';position:absolute;left:0;right:0;top:50%;height:96px;margin-top:-48px;background:linear-gradient(90deg,transparent,rgba(4,9,15,.78) 26%,rgba(4,9,15,.78) 74%,transparent);border-block:1px solid rgba(63,208,255,.35)}
.lb-pausebox>*{position:relative}
.lb-pausebox b{font:900 34px/1 var(--fk);letter-spacing:.3em;padding-left:.3em;color:#fff;text-shadow:0 0 16px rgba(63,208,255,.8),0 2px 0 #000}
.lb-pausebox small{font:700 15px/1 var(--fn);letter-spacing:.6em;padding-left:.6em;color:var(--ye)}

/* \u2500\u2500 result \u2500\u2500 */
.lb-result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:0;transition:opacity .35s;
  padding:calc(var(--st) + 12px) calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px);
  background:radial-gradient(ellipse at 50% 42%,rgba(14,44,66,.6),rgba(2,5,9,.94) 72%)}
.lb-result::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);pointer-events:none}
.lb-result.lose{background:radial-gradient(ellipse at 50% 42%,rgba(70,14,14,.6),rgba(6,2,3,.95) 72%)}
.lb-result.show{opacity:1}
.lb-rp{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;isolation:isolate}
.lb-rp::before{content:'';position:absolute;z-index:-1;left:50%;top:-14px;width:calc(var(--vw,1vw)*100);height:calc(100% + 28px);margin-left:calc(var(--vw,1vw)*-50);animation:lb-grow .6s cubic-bezier(.2,.9,.2,1) both;background:linear-gradient(90deg,transparent,var(--bc,#3fd0ff) 50%,transparent) top/100% 1.5px no-repeat,linear-gradient(90deg,transparent,var(--bc,#3fd0ff) 50%,transparent) bottom/100% 1.5px no-repeat,linear-gradient(90deg,transparent,rgba(3,10,16,.78) 28%,rgba(3,10,16,.78) 72%,transparent)}
.lose .lb-rp{--bc:#ff5a4a}
.lb-r-en{display:flex;align-items:center;gap:14px;font:700 24px/1 var(--fn);letter-spacing:.62em;padding-left:.62em;color:var(--cy);text-shadow:0 0 12px var(--cy)}
.lb-r-en::before,.lb-r-en::after{content:'';width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--ye))}
.lb-r-en::after{transform:scaleX(-1)}
.lose .lb-r-en{color:#ff8a7a;text-shadow:0 0 12px var(--rd)}
.lb-r-ko{font:900 112px/1.02 var(--fk);letter-spacing:.06em;padding:0 .1em;
  background:linear-gradient(180deg,#fff 0%,#d4f5ff 42%,#3fd0ff 56%,#0b5e8c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(63,208,255,.55)) drop-shadow(0 4px 0 #031018)}
.lose .lb-r-ko{background-image:linear-gradient(180deg,#fff 0%,#ffd0c8 40%,#ff5a4a 58%,#6a0c0c 100%);filter:drop-shadow(0 0 18px rgba(255,60,40,.55)) drop-shadow(0 4px 0 #180303)}
.lb-stars{display:flex;align-items:flex-end;gap:12px;margin-top:-4px}
.lb-star{position:relative;width:74px;height:74px}
.lb-star.mid{width:94px;height:94px;margin-bottom:14px}
.lb-star .lb-ic{position:absolute;inset:0;width:100%;height:100%}
.lb-star.on .gold{animation:lb-star-in .5s cubic-bezier(.2,1.6,.4,1) var(--d) both;filter:drop-shadow(0 0 10px rgba(255,200,60,.8))}
.lb-star.on::before{content:'';position:absolute;inset:-45%;background:repeating-conic-gradient(rgba(255,214,90,.55) 0 7deg,transparent 7deg 24deg);
  -webkit-mask:radial-gradient(closest-side,#000 35%,transparent);mask:radial-gradient(closest-side,#000 35%,transparent);
  animation:lb-rays .9s ease-out var(--d) both}
.lb-r-stats{display:flex;gap:10px}
.lb-r-stat{--c:9px;min-width:118px;padding:7px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lb-r-stat span{font:700 12.5px/1 var(--fk);color:var(--dim);letter-spacing:.08em}
.lb-r-stat b{font:700 28px/1 var(--fn);color:#fff;text-shadow:0 0 8px rgba(63,208,255,.5)}
.lb-r-stat b small{font-size:.62em;color:var(--dim)}
.lb-r-btns{display:flex;gap:10px;margin-top:2px}
.lb-big{--c:12px;height:58px;min-width:150px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1}
.lb-big b{font:900 19px/1 var(--fk);text-shadow:0 1px 0 #000}
.lb-big small{font:700 11px/1 var(--fn);letter-spacing:.34em;padding-left:.34em;color:var(--cy)}
.lb-big.pri{--edge:linear-gradient(180deg,#fff0a8,#f2c12e 35%,#8a6a10 75%,#f2c12e);
  --fill:linear-gradient(180deg,rgba(242,193,46,.28),rgba(242,193,46,.04) 55%),var(--noise) 0 0/440px 30px,linear-gradient(180deg,#3a3420,#15120a)}
.lb-big.pri small{color:var(--ye)}
.lb-rp>*{animation:lb-rise .45s cubic-bezier(.2,.9,.3,1) both}
.lb-rp>.lb-r-ko{animation:lb-slam .55s cubic-bezier(.2,1.2,.3,1) .1s both}
.lb-rp>.lb-r-stats{animation-delay:.9s}.lb-rp>.lb-r-btns{animation-delay:1.05s}.lb-rp>.lb-stars{animation-delay:.25s}

/* \u2500\u2500 title \u2500\u2500 */
.lb-title{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);opacity:0;transition:opacity .4s;
  background:radial-gradient(ellipse at 50% 34%,rgba(30,90,130,.38),transparent 60%),linear-gradient(180deg,rgba(3,6,10,.9),rgba(3,6,10,.7) 55%,rgba(3,6,10,.95))}
.lb-title.show{opacity:1}
.lb-title::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7))}
.lb-t-grid{position:absolute;left:-60%;right:-60%;bottom:-4%;height:70%;pointer-events:none;overflow:hidden;
  -webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%);transform:perspective(380px) rotateX(58deg);transform-origin:50% 100%}
.lb-t-grid::before{content:'';position:absolute;left:0;right:0;top:-64px;bottom:0;animation:lb-grid 2.4s linear infinite;
  background:linear-gradient(rgba(63,208,255,.5) 2px,transparent 2px) 0 0/64px 64px,linear-gradient(90deg,rgba(63,208,255,.4) 2px,transparent 2px) 0 0/64px 64px}
.lb-t-embers{position:absolute;inset:0;pointer-events:none}
.lb-t-embers i{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#ffd9a0;opacity:0;box-shadow:0 0 6px 2px rgba(255,140,50,.65);animation:lb-ember var(--s) linear var(--d) infinite}
.lb-t-embers i:nth-child(3n){background:#bff3ff;box-shadow:0 0 6px 2px rgba(63,208,255,.6)}
.lb-t-logo{position:relative;z-index:1;display:flex;align-items:center;gap:16px;animation:lb-rise .7s cubic-bezier(.2,.9,.3,1) both}
.lb-t-logo::before{content:'';position:absolute;z-index:-1;left:-30%;right:-30%;top:50%;height:150px;margin-top:-75px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(63,208,255,.22),transparent 70%),linear-gradient(90deg,transparent,rgba(170,240,255,.85) 50%,transparent) center/100% 2px no-repeat;animation:lb-flare 4s ease-in-out infinite}
.lb-emblem{width:176px;height:auto;filter:drop-shadow(0 0 16px rgba(63,208,255,.5)) drop-shadow(0 4px 2px rgba(0,0,0,.8))}
.lb-t-words{display:flex;flex-direction:column;align-items:flex-start}
.lb-t-last{font:700 30px/1 var(--fn);letter-spacing:1.04em;color:var(--cy);margin:0 0 -2px 6px;text-shadow:0 0 12px var(--cy)}
.lb-t-bast{font:700 108px/.92 var(--fn);letter-spacing:.05em;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,#7d91a3 0%,#f6fcff 18%,#9fb3c4 32%,#5a6b7b 50%,#e6f2fa 66%,#7a8c9c 82%,#dfeaf2 100%);background-size:260% 100%;
  filter:drop-shadow(0 0 1px #bff3ff) drop-shadow(0 0 14px rgba(63,208,255,.45)) drop-shadow(0 5px 0 #02080e);animation:lb-shine 6s linear infinite}
.lb-t-bar{display:flex;align-items:center;gap:12px;margin-top:8px;font:900 22px/1 var(--fk);letter-spacing:.55em;color:#d8e8f2;text-shadow:0 2px 0 #000}
.lb-t-bar::before{content:'';width:92px;height:9px;background:repeating-linear-gradient(-45deg,var(--ye) 0 6px,#16130a 6px 12px);clip-path:${Vh.a("4px")}}
.lb-t-bar::after{content:'';flex:1;min-width:40px;height:2px;background:linear-gradient(90deg,var(--cy),transparent)}
.lb-t-stages{position:relative;z-index:1;display:flex;gap:12px;max-width:100%;overflow-x:auto;padding:6px 4px 10px;scroll-snap-type:x mandatory;
  scrollbar-width:none;animation:lb-rise .7s cubic-bezier(.2,.9,.3,1) .15s both}
.lb-t-stages::-webkit-scrollbar{display:none}
.lb-card{--c:15px;flex:none;width:158px;height:152px;padding:11px 13px 12px;display:flex;flex-direction:column;align-items:flex-start;scroll-snap-align:center;overflow:hidden}
.lb-card>*{position:relative}
.lb-card>.lb-card-pl{position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;opacity:.6;background:radial-gradient(circle at 34% 34%,var(--a),var(--b) 58%,#000 100%);box-shadow:inset -10px -10px 20px rgba(0,0,0,.75),0 0 22px var(--a)}
.lb-card>.lb-card-pl::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--a);opacity:.45;transform:scaleY(.32) rotate(-12deg)}
.lb-card-no{display:flex;align-items:baseline;gap:6px;font:700 42px/1 var(--fn);color:var(--cy);text-shadow:0 0 10px rgba(63,208,255,.6)}
.lb-card-no small{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.lb-card-name{margin-top:4px;font:900 17px/1.2 var(--fk);text-shadow:0 1px 0 #000}
.lb-card-sub{margin-top:2px;font:700 12px/1.3 var(--fk);color:var(--dim)}
.lb-card-stars{margin-top:auto;display:flex;gap:3px}
.lb-card-stars .lb-ic{width:21px;height:21px}
.lb-card.lb-lock{--edge:linear-gradient(180deg,#5a6874,#2a333c);cursor:default}
.lb-card.lb-lock>*:not(.lb-card-lock){opacity:.35}
.lb-card.lb-lock::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(-45deg,rgba(242,193,46,.6) 0 6px,transparent 6px 12px)}
.lb-card>.lb-card-lock{position:absolute;right:12px;top:12px}
.lb-card-lock .lb-ic{width:30px;height:30px}
.lb-t-start{position:relative;z-index:1;height:64px;min-width:250px;--c:16px;animation:lb-rise .7s cubic-bezier(.2,.9,.3,1) .3s both}
.lb-t-start b{font-size:24px;letter-spacing:.3em;padding-left:.3em}
.lb-t-start::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,240,190,.35),transparent);animation:lb-sheen 3s ease-in-out infinite}

/* \u2500\u2500 keyframes \u2500\u2500 */
@keyframes lb-spin{to{transform:rotate(360deg)}}
@keyframes lb-ret-in{from{transform:scale(1.7);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-pop{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-glow{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes lb-sheen{0%,62%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes lb-blink{0%{opacity:1}100%{opacity:.45}}
@keyframes lb-toast-in{from{transform:translateY(-12px) scaleX(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-toast-out{to{transform:translateY(-8px);opacity:0}}
@keyframes lb-band{0%{transform:scaleX(0);opacity:0}12%{transform:scaleX(1);opacity:1}84%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.1);opacity:0}}
@keyframes lb-flash{0%{transform:scaleX(0);opacity:1}14%{transform:scaleX(1);opacity:.9}26%{transform:scaleX(1);opacity:0}100%{opacity:0}}
@keyframes lb-ban-t{0%,8%{opacity:0;transform:scale(1.9)}20%{opacity:1;transform:scale(.97)}27%{transform:none}84%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
@keyframes lb-ban-s{0%,20%{opacity:0;transform:translateY(12px)}32%{opacity:1;transform:none}84%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes lb-slam{from{transform:scale(2.3);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-star-in{0%{transform:scale(2.6) rotate(-35deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes lb-rays{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1) rotate(50deg);opacity:.35}}
@keyframes lb-rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-grow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes lb-ember{0%{transform:translate(0,0);opacity:0}12%{opacity:1}80%{opacity:.7}100%{transform:translate(var(--dx),calc(var(--vh,1vh)*-105));opacity:0}}
@keyframes lb-flare{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes lb-grid{to{transform:translateY(64px)}}
@keyframes lb-shine{to{background-position:-260% 0}}

/* \u2500\u2500 short screens (Fold cover ~900\xD7400): tighter paddings/fonts, 44 px touch targets kept \u2500\u2500 */
/* size rules ask the HUD root (container queries), not the window: on a phone held upright the stage is turned 90\xB0 */
@container lb (max-height:560px){
  .lb-tl,.lb-tr{top:calc(var(--st) + 6px)}
  .lb-res{height:36px;padding:0 11px 0 8px}
  .lb-chip .lb-ic{width:24px;height:24px}
  .lb-num{font-size:21px}.lb-max{font-size:15px}
  .lb-wave{padding:3px 26px 8px;min-width:214px;gap:3px;--c:17px}
  .lb-wave-cur{font-size:25px}.lb-wave-tot{font-size:16px;padding-bottom:2px}.lb-wave-lbl{font-size:13px}
  .lb-wave-top .lb-ic{width:21px;height:21px}
  .lb-life .lb-ic{width:18px;height:18px}.lb-bar{height:10px;min-width:100px}.lb-life-num{font-size:16px}
  .lb-tc{gap:5px}
  .lb-toast{font-size:13px;padding:6px 14px 6px 10px}
  .lb-seg button{width:48px}
  .lb-pause,.lb-fs{width:48px;height:50px}
  .lb-br{right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 8px)}
  .lb-next-body{height:54px;gap:8px;padding:0 14px 0 11px;--c:13px}
  .lb-next-body>.lb-ic{width:30px;height:30px}
  .lb-next-txt b{font-size:17px}.lb-next-txt small{font-size:10px;margin-top:3px}
  .lb-next-bonus{font-size:18px;padding-left:8px}
  .lb-tp{width:300px;padding:8px 10px 9px}
  .lb-tp-ic{width:42px;height:42px}.lb-tp-ic .lb-ic{width:33px;height:33px}
  .lb-tp-name{font-size:16px}
  .lb-tp-stats{grid-template-columns:1fr auto 1fr auto;margin:6px 0 7px;padding-top:5px;gap:3px 8px;font-size:12.5px}
  .lb-tp-stats b{font-size:15px}
  .lb-act{height:46px;gap:3px}
  .lb-ban-band{top:-46px;height:92px}
  .lb-ban-t{font-size:52px}.lb-ban-s{font-size:16px;margin-top:4px}
  .lb-rp{gap:8px}
  .lb-r-en{font-size:16px}.lb-r-en::before,.lb-r-en::after{width:40px}
  .lb-r-ko{font-size:62px}
  .lb-star{width:50px;height:50px}.lb-star.mid{width:64px;height:64px;margin-bottom:8px}
  .lb-r-stat{min-width:96px;padding:4px 12px 5px}.lb-r-stat b{font-size:22px}
  .lb-big{height:48px;min-width:126px}
  .lb-big b{font-size:16px}
  .lb-title{gap:12px}
  .lb-emblem{width:96px}
  .lb-t-last{font-size:19px}.lb-t-bast{font-size:64px}
  .lb-t-bar{font-size:15px;margin-top:5px}.lb-t-bar::before{width:56px;height:7px}
  .lb-card{width:136px;height:112px;padding:8px 11px 9px;--c:12px}.lb-card>.lb-card-pl{width:70px;height:70px}
  .lb-card-no{font-size:30px}.lb-card-name{font-size:14px;margin-top:2px}.lb-card-sub{font-size:11px}
  .lb-card-stars .lb-ic{width:17px;height:17px}
  .lb-t-start{height:50px}
  .lb-t-start b{font-size:19px}
}
/* portrait / very narrow fallback: wave tab drops below the resource rows */
